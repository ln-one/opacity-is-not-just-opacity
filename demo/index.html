<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2710%27 fill=%27%237760a7%27/%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2710%27 fill=%27none%27 stroke=%27white%27 stroke-width=%274%27/%3E%3C/svg%3E"><title>ONJO — A little beyond opacity</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
<section class="lab" aria-label="Interactive opacity playground"><div class="toolbar"><div class="canvas-title">ONJO</div><div class="segmented"><button id="solo" aria-pressed="true"><svg aria-hidden="true"
  class="ui-icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="18" x="3" y="3" rx="2" />
</svg>
<span>Explore</span></button><button id="compare" aria-pressed="false"><svg aria-hidden="true"
  class="ui-icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="18" x="3" y="3" rx="2" />
  <path d="M12 3v18" />
</svg>
<span>Compare</span></button></div><div class="toolbar-actions"><button id="theme" class="quiet theme-button" aria-label="Theme: Auto. Switch to Light" title="Theme: Auto. Click for Light"><svg aria-hidden="true"
  class="ui-icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="20" height="14" x="2" y="3" rx="2" />
  <line x1="8" x2="16" y1="21" y2="21" />
  <line x1="12" x2="12" y1="17" y2="21" />
</svg>
<span id="theme-label">Auto</span></button><button id="reset" class="quiet" aria-label="Reset" title="Reset"><svg aria-hidden="true"
  class="ui-icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
  <path d="M3 3v5h5" />
</svg>
<span>Reset</span></button></div></div>
<div class="stage" id="stage"><section class="panel baseline" aria-label="Original source colors"><div class="panel-label">ORIGINAL <span>α 1.00</span></div><div class="icons" id="original"></div></section><section class="panel result" aria-label="Adjusted colors"><div class="panel-label"><span id="mode-label">DIFFERENCE EXPANSION</span><span id="panel-alpha">α 1.40</span></div><div class="icons" id="result"></div></section><div class="loading" id="loading">Preparing your canvas…</div></div>
<div class="controls"><div class="background-control"><div class="control-label">BACKGROUND <span id="hex">#181818</span></div><div class="swatches" id="swatches"></div><label class="custom">Custom color <input id="custom" type="color" value="#181818" aria-label="Choose background color"></label></div><div class="alpha-control"><div class="control-label">ALPHA <output id="value">1.40</output></div><input id="alpha" aria-label="Alpha coefficient" type="range" min="0" max="2.5" step="0.025" value="1.4"><div class="scale"><span>0 · Blend in</span><button id="one">1 · Source</button><span>2.5 · Stand out</span></div></div></div></section>
<p id="explanation" hidden aria-live="polite"></p></main><script src="app.js"></script></body></html>
