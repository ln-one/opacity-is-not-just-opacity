name: Deploy ONJO demo
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'experiments/formal-evaluation/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static demo
        run: |
          mkdir -p _site/experiments/formal-evaluation
          cp -R demo _site/demo
          cp -R experiments/formal-evaluation/assets _site/experiments/formal-evaluation/assets
          cp demo/redirect.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
